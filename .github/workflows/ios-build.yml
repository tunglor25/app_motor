name: iOS Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM Dependencies
        run: npm install

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios
          echo "--- Capacitor sync completed ---"

      - name: Resolve SPM Dependencies
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -resolvePackageDependencies

      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT=$(pwd)/build \
            build
          
      - name: Package into Unsigned IPA
        run: |
          echo "--- Searching for .app bundle ---"
          # Search in the explicit build output first
          APP_PATH=$(find ios/App/build -name "*.app" -type d 2>/dev/null | head -1)
          # Fallback: search in DerivedData
          if [ -z "$APP_PATH" ]; then
            echo "Not found in ios/App/build, searching DerivedData..."
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -path "*/Release-iphoneos/*" -type d 2>/dev/null | head -1)
          fi
          # Final check
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found anywhere!"
            echo "--- ios/App/build contents ---"
            find ios/App/build -type f 2>/dev/null | head -30 || echo "build dir empty or missing"
            echo "--- DerivedData contents ---"
            find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -10 || echo "No .app in DerivedData"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r app-motor-ios-unsigned.ipa Payload
          echo "IPA created successfully!"
          ls -la app-motor-ios-unsigned.ipa
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-motor-ios-unsigned
          path: app-motor-ios-unsigned.ipa
