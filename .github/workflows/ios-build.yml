name: iOS Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM Dependencies
        run: npm install

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios
          echo "--- Capacitor sync completed ---"
          ls -la ios/App/

      - name: Resolve SPM Dependencies
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -resolvePackageDependencies

      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -list
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          
      - name: Package into Unsigned IPA
        run: |
          echo "--- Finding .app bundle ---"
          find ios/App/build -name "*.app" -type d 2>/dev/null || true
          APP_PATH=$(find ios/App/build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found. Listing build directory:"
            find ios/App/build -maxdepth 4 -type d
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r app-motor-ios-unsigned.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-motor-ios-unsigned
          path: app-motor-ios-unsigned.ipa
