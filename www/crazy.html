<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Telemetry Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #2BE7FF;
    --red: #ff2130;
    --amber: #ffb703;
    --green: #00ff66;
    --bg-dark: #030304;
    --bg-panel: rgba(10, 12, 16, 0.85);
    --dim: rgba(255,255,255,0.45);
    --hud-border: 1px solid rgba(43, 231, 255, 0.3);
    --hud-glow: 0 0 10px rgba(43, 231, 255, 0.2);
  }
  html.light-theme {
    --cyan: #008eb3;
    --bg-dark: #e0e5ec;
    --bg-panel: rgba(255, 255, 255, 0.85);
    --dim: rgba(0,0,0,0.45);
    --hud-border: 1px solid rgba(0, 142, 179, 0.3);
    --hud-glow: 0 4px 8px rgba(0,0,0,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; 
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg-dark); color: #fff; font-family: 'Share Tech Mono', monospace;
    overflow: hidden; touch-action: none; width: 100vw; height: 100vh;
  }
  html.light-theme body { color: #111; }
  
  #app {
    position: relative; width: 100%; height: 100%; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 5px) env(safe-area-inset-right, 5px) env(safe-area-inset-bottom, 5px) env(safe-area-inset-left, 5px);
    background: radial-gradient(circle at center, rgba(43, 231, 255, 0.05) 0%, var(--bg-dark) 80%);
  }
  html.light-theme #app { background: radial-gradient(circle at center, rgba(255,255,255,0.8) 0%, var(--bg-dark) 80%); }

  /* TOP BAR */
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 16px; border-bottom: var(--hud-border);
    background: linear-gradient(90deg, transparent, rgba(43,231,255,0.1), transparent);
    flex-shrink: 0; z-index: 10;
  }
  .top-bar-side { display: flex; gap: 16px; align-items: center; }
  .tb-label { font-size: 10px; color: var(--cyan); letter-spacing: 2px; text-shadow: 0 0 5px var(--cyan); }
  .tb-val { font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 700; color: #fff; }
  html.light-theme .tb-val { color: #111; }

  /* MAIN CONTENT AREA */
  .main-content {
    flex: 1; display: flex; position: relative; overflow: hidden;
  }
  
  /* PANELS */
  .side-panel {
    width: 240px; display: flex; flex-direction: column; gap: 12px;
    padding: 12px; z-index: 5; justify-content: center;
  }
  .panel-box {
    background: var(--bg-panel); border: var(--hud-border);
    padding: 12px; position: relative; box-shadow: var(--hud-glow);
    clip-path: polygon(0 10px, 10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
  }
  .panel-box::before {
    content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--cyan);
  }
  .panel-title { font-size: 10px; color: var(--dim); letter-spacing: 2px; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; }
  
  /* LEFT PANEL: ECT & TPS */
  .ect-container { display: flex; align-items: flex-end; gap: 10px; height: 120px; }
  .ect-bar-bg { width: 16px; height: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); position: relative; }
  .ect-bar-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: var(--cyan); transition: height 0.3s, background 0.3s; box-shadow: 0 0 10px var(--cyan); }
  .ect-info { display: flex; flex-direction: column; justify-content: space-between; height: 100%; }
  .ect-val { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 700; color: #fff; }
  html.light-theme .ect-val { color: #111; }
  
  .tps-container { margin-top: 12px; }
  .tps-bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); position: relative; margin-top: 4px; }
  .tps-bar-fill { height: 100%; width: 0%; background: var(--cyan); transition: width 0.1s; box-shadow: 0 0 8px var(--cyan); }
  .tps-header { display: flex; justify-content: space-between; font-size: 12px; }
  
  .trip-info-box { display: flex; flex-direction: column; gap: 6px; }
  .trip-row { display: flex; justify-content: space-between; align-items: baseline; }
  .trip-lbl { font-size: 10px; color: var(--dim); }
  .trip-v { font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 500; }

  /* RIGHT PANEL: BATT & DIAG */
  .batt-status { display: flex; justify-content: space-between; align-items: baseline; }
  .batt-val { font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 700; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
  .batt-lbl { font-size: 12px; color: var(--green); }
  
  .diag-list { display: flex; flex-direction: column; gap: 8px; }
  .diag-item { display: flex; justify-content: space-between; font-size: 11px; padding: 4px; background: rgba(255,255,255,0.02); }
  .diag-ok { color: var(--green); text-shadow: 0 0 4px var(--green); }
  .diag-fault { color: var(--red); text-shadow: 0 0 4px var(--red); animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  /* CENTER GAUGE */
  .center-gauge-container {
    flex: 1; display: flex; justify-content: center; align-items: center; position: relative; z-index: 1;
  }
  .gauge-svg { width: min(95%, 85vh); height: auto; filter: drop-shadow(0 0 15px rgba(43,231,255,0.2)); overflow: visible; }
  .gauge-tick { transition: stroke 0.05s, filter 0.05s; }
  
  .speed-display {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: min(50%, 45vh); height: min(50%, 45vh);
    background: radial-gradient(circle, rgba(10,12,16,0.9) 0%, transparent 70%);
    border-radius: 50%;
  }
  html.light-theme .speed-display { background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, transparent 70%); }
  
  .speed-val { font-family: 'Orbitron', sans-serif; font-size: min(150px, 15vh); font-weight: 900; line-height: 0.8; letter-spacing: -2px; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
  .speed-unit { font-size: 16px; color: var(--cyan); letter-spacing: 4px; margin-top: 5px; }  
  /* SPEED LIMIT SIGN */
  .speed-limit-sign {
    position: absolute; top: 15%; right: 15%;
    width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid var(--red); background: rgba(255,255,255,0.95);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 15px rgba(255,33,48,0.5); z-index: 20; transition: opacity 0.3s;
  }
  .speed-limit-sign.hidden { opacity: 0; pointer-events: none; }
  .speed-limit-val { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900; color: #111; }
  
  /* GPS SPEED */
  .gps-speed { position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); font-size: 14px; color: var(--dim); display: flex; align-items: baseline; gap: 6px; }
  .gps-speed-val { font-family: 'Orbitron', sans-serif; font-size: 20px; color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }

  /* BOTTOM BAR */
  .bottom-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 16px; border-top: var(--hud-border);
    background: linear-gradient(90deg, transparent, rgba(43,231,255,0.1), transparent);
    flex-shrink: 0; z-index: 10;
  }
  .bb-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .bb-lbl { font-size: 9px; color: var(--dim); letter-spacing: 1px; }
  .bb-val { font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 500; color: #fff; }
  html.light-theme .bb-val { color: #111; }
  .bb-val.cyan { color: var(--cyan); text-shadow: 0 0 5px var(--cyan); }
  
  .btn-gear {
    width: 36px; height: 36px; background: transparent; border: 1px solid var(--cyan);
    color: var(--cyan); font-size: 18px; cursor: pointer;
    clip-path: polygon(0 5px, 5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%);
    transition: all 0.2s; display: flex; align-items: center; justify-content: center;
  }
  .btn-gear:active { background: rgba(43,231,255,0.2); box-shadow: inset 0 0 10px var(--cyan); }
  html.light-theme .btn-gear { border-color: #008eb3; color: #008eb3; }

  /* MUSIC FAB (Copied pattern) */
  .music-fab {
    position: absolute; bottom: 70px; right: 20px;
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(10,12,16,0.8); border: 2px solid var(--cyan);
    color: var(--cyan); font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 12px rgba(43,231,255,0.4);
    cursor: pointer; z-index: 100; transition: all 0.2s;
  }
  .music-fab:active { transform: scale(0.9); }
  .music-fab.hidden { display: none; }

  /* TRIP TRACKER INTEGRATION */
  .btn-trip-hud {
    background: transparent; border: 1px solid var(--cyan); color: var(--cyan);
    padding: 6px 12px; font-family: 'Share Tech Mono', monospace; font-size: 12px;
    clip-path: polygon(0 5px, 5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%);
    cursor: pointer; position: relative; overflow: hidden;
  }
  .btn-trip-hud.recording { border-color: var(--red); color: var(--red); box-shadow: 0 0 10px rgba(255,33,48,0.4); animation: btnRecPulse 1.5s infinite; }
  .btn-trip-hud .progress { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--red); width: 0%; transition: width 0.1s linear; }

  /* RESPONSIVE */
  @media (orientation: portrait) {
    .main-content { flex-direction: column; overflow-y: auto; overflow-x: hidden; }
    .side-panel { width: 100%; flex-direction: row; flex-wrap: wrap; padding: 4px; gap: 4px; }
    .panel-box { flex: 1; min-width: 45%; padding: 8px; }
    .center-gauge-container { min-height: 50vh; }
    .speed-val { font-size: min(100px, 12vh); }
    .music-fab { bottom: 80px; right: 10px; width: 40px; height: 40px; font-size: 16px; }
  }
  @media (orientation: landscape) {
    .main-content { flex-direction: row; }
  }

  /* POPUPS from race.html can be added here if needed, keeping music overlay logic */
</style>
<script>
  if (localStorage.getItem('light_mode') === 'true') { document.documentElement.classList.add('light-theme'); }
</script>
<script src="js/ios_statusbar.js"></script>
</head>
<body id="body">

  <div class="main-content" id="mainContent">

    <!-- RIGHT PANEL -->
    <div class="side-panel">

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">

      <span class="bb-lbl">ODO</span>

      <span class="bb-lbl">TIME</span>

<script src="js/data_engine.js"></script>
<script src="js/trip_tracker.js"></script>
<script>
  // Setup SVG Gauge (270 degree arc, from -135 to 135)
  const gaugeSvg = document.getElementById('gaugeSvg');
  const MAX_RPM = 14000;
  const NUM_TICKS = 56;
  const START_ANGLE = -135;
  const END_ANGLE = 135;
  const RADIUS_OUTER = 100;
  const RADIUS_INNER = 85;
  
  const cCyan = [43,231,255], cAmber = [255,183,3], cRed = [255,33,48];
  function lerp(a,b,t){ return a+(b-a)*t; }
  function rgbStr(r,g,b){ return `rgb(${r},${g},${b})`; }
  function getGaugeColor(ratio) {
    if(ratio <= 10/14) return rgbStr(...cCyan);
    if(ratio <= 12/14) return rgbStr(...cAmber);
    return rgbStr(...cRed);
  }

  const ticks = [];
  for(let i=0; i<NUM_TICKS; i++) {
    const ratio = i / (NUM_TICKS - 1);
    const angleDeg = START_ANGLE + (END_ANGLE - START_ANGLE) * ratio;
    const angleRad = angleDeg * Math.PI / 180;
    
    const x1 = Math.sin(angleRad) * RADIUS_INNER;
    const y1 = -Math.cos(angleRad) * RADIUS_INNER;
    const x2 = Math.sin(angleRad) * RADIUS_OUTER;
    const y2 = -Math.cos(angleRad) * RADIUS_OUTER;
    
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', '#1e1e24');
    line.setAttribute('stroke-width', '3');
    line.setAttribute('stroke-linecap', 'round');
    line.classList.add('gauge-tick');
    
    gaugeSvg.appendChild(line);
    ticks.push({ el: line, color: getGaugeColor(ratio) });
  }

  // Draw numbers
  for(let i=0; i<=14; i+=2) {
    const ratio = i / 14;
    const angleDeg = START_ANGLE + (END_ANGLE - START_ANGLE) * ratio;
    const angleRad = angleDeg * Math.PI / 180;
    const rLabel = 72;
    const x = Math.sin(angleRad) * rLabel;
    const y = -Math.cos(angleRad) * rLabel;
    
    const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    txt.setAttribute('x', x);
    txt.setAttribute('y', y + 4); // manual vertical center adjust
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('fill', i>=12 ? 'var(--red)' : 'var(--dim)');
    txt.setAttribute('font-family', "'Orbitron', sans-serif");
    txt.setAttribute('font-size', '10px');
    txt.setAttribute('font-weight', '700');
    txt.textContent = i;
    gaugeSvg.appendChild(txt);
  }

  function updateGauge(rpm) {
    if(rpm > MAX_RPM) rpm = MAX_RPM;
    const ratio = rpm / MAX_RPM;
    const activeTicks = Math.round(ratio * NUM_TICKS);
    
    for(let i=0; i<NUM_TICKS; i++) {
      if(i < activeTicks) {
        ticks[i].el.setAttribute('stroke', ticks[i].color);
        ticks[i].el.style.filter = `drop-shadow(0 0 4px ${ticks[i].color})`;
      } else {
        ticks[i].el.setAttribute('stroke', '#1e1e24');
        ticks[i].el.style.filter = 'none';
      }
    }
  }

  // Boot sweep animation
  async function bootSweep() {
    for(let i=0; i<NUM_TICKS; i++) {
      ticks[i].el.setAttribute('stroke', ticks[i].color);
      ticks[i].el.style.filter = `drop-shadow(0 0 4px ${ticks[i].color})`;
      await new Promise(r => setTimeout(r, 10));
    }
    await new Promise(r => setTimeout(r, 500));
    for(let i=NUM_TICKS-1; i>=0; i--) {
      ticks[i].el.setAttribute('stroke', '#1e1e24');
      ticks[i].el.style.filter = 'none';
      await new Promise(r => setTimeout(r, 8));
    }
  }
  bootSweep();

  // Clock
  setInterval(() => {
    const d = new Date();
    document.getElementById('clock').textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }, 1000);

  // Settings & Navigation
  document.getElementById('btnGear').addEventListener('click', (e) => { e.stopPropagation(); window.location.href = 'settings.html'; });
  document.getElementById('body').addEventListener('dblclick', () => { window.location.href = 'race.html'; });

  // StatusBar hiding for iOS
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar) {
    window.Capacitor.Plugins.StatusBar.hide();
    window.Capacitor.Plugins.StatusBar.setOverlaysWebView({ overlay: true });
  }

  // Data integration
  let lastECUSpeed = 0;
  window.addEventListener('ecu_data', (e) => {
    const data = e.detail;
    updateGauge(data.rpm);
    
    lastECUSpeed = Math.round(data.speed);
    document.getElementById('speedVal').textContent = lastECUSpeed;
    document.getElementById('rpmBotVal').textContent = Math.round(data.rpm);
    
    document.getElementById('ectVal').textContent = Math.round(data.ect);
    let ectRatio = Math.min(data.ect / 120, 1);
    let ectFill = document.getElementById('ectFill');
    ectFill.style.height = (ectRatio * 100) + '%';
    ectFill.style.background = data.ect > 105 ? 'var(--red)' : 'var(--cyan)';
    
    document.getElementById('tpsVal').textContent = Math.round(data.tps) + '%';
    document.getElementById('tpsFill').style.width = Math.round(data.tps) + '%';
    
    document.getElementById('battVal').textContent = data.battery.toFixed(1);
    document.getElementById('battStatus').textContent = data.battery < 11.5 ? 'LOW' : 'GOOD';
    document.getElementById('battStatus').style.color = data.battery < 11.5 ? 'var(--red)' : 'var(--green)';
    
    document.getElementById('tripVal').textContent = data.tripA.toFixed(1) + ' km';
    if(document.getElementById('fuelVal')) document.getElementById('fuelVal').textContent = data.instantL100km.toFixed(1) + ' L/100';
    
    if (window.TripTracker && TripTracker.isRecording()) {
      TripTracker.addECUData(lastECUSpeed, data.rpm, data.ect, data.tps, data.battery);
    }
  });

  // Trip tracker logic
  const btnTrip = document.getElementById('btnTrip');
  const btnTripProg = document.getElementById('btnTripProgress');
  let tripHoldStart = 0;
  let tripHoldFrame = null;
  
  btnTrip.addEventListener('click', () => {
    if(!window.TripTracker) return;
    if(!TripTracker.isRecording()) {
      TripTracker.start();
      btnTrip.innerHTML = '■ STOP REC<div class="progress" id="btnTripProgress"></div>';
      btnTrip.classList.add('recording');
    }
  });
  
  btnTrip.addEventListener('pointerdown', (e) => {
    if(!window.TripTracker || !TripTracker.isRecording()) return;
    tripHoldStart = Date.now();
    document.getElementById('btnTripProgress').style.width = '0%';
    
    function anim() {
      const elap = Date.now() - tripHoldStart;
      const prog = Math.min(elap / 1500 * 100, 100);
      document.getElementById('btnTripProgress').style.width = prog + '%';
      if(elap >= 1500) {
        const id = TripTracker.stop();
        btnTrip.innerHTML = '▶ REC TRIP<div class="progress" id="btnTripProgress"></div>';
        btnTrip.classList.remove('recording');
        if(id) window.location.href = `trip_result.html?id=${id}`;
        return;
      }
      tripHoldFrame = requestAnimationFrame(anim);
    }
    tripHoldFrame = requestAnimationFrame(anim);
  });
  
  btnTrip.addEventListener('pointerup', () => {
    if(tripHoldFrame) cancelAnimationFrame(tripHoldFrame);
    if(document.getElementById('btnTripProgress')) document.getElementById('btnTripProgress').style.width = '0%';
  });
  btnTrip.addEventListener('pointerleave', () => {
    if(tripHoldFrame) cancelAnimationFrame(tripHoldFrame);
    if(document.getElementById('btnTripProgress')) document.getElementById('btnTripProgress').style.width = '0%';
  });
  
  setInterval(() => {
    if(window.TripTracker && TripTracker.isRecording()) {
      const stats = TripTracker.getCurrentStats();
      const s = Math.floor(stats.duration / 1000);
      const m = Math.floor(s/60);
      document.getElementById('tripTime').textContent = String(m).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
    }
  }, 1000);

  // GPS & Speed Limit
  const tomtomKey = 'TNsjEBPR6I6MSu4Lwq1O3YO8udmg5aU3';
  let lastSpeedCheck = 0;
  let currLimit = 0;
  let lastGPSSpeed = 0;
  
  if(window.Capacitor && Capacitor.Plugins.Geolocation) {
    Capacitor.Plugins.Geolocation.watchPosition({enableHighAccuracy: true, timeout: 10000}, (pos, err) => {
      if(!pos) return;
      const speed = pos.coords.speed;
      if(speed !== null && speed >= 0) {
        lastGPSSpeed = Math.round(speed * 3.6);
        document.getElementById('gpsSpeedVal').textContent = lastGPSSpeed;
      }
      if(window.TripTracker && TripTracker.isRecording()) {
        TripTracker.addGPSPoint(pos.coords.latitude, pos.coords.longitude, lastGPSSpeed, Date.now(), pos.coords.accuracy);
      }
      
      const now = Date.now();
      if(now - lastSpeedCheck > 10000) {
        lastSpeedCheck = now;
        fetch(`https://api.tomtom.com/search/2/reverseGeocode/${pos.coords.latitude},${pos.coords.longitude}.json?key=${tomtomKey}&returnSpeedLimit=true`)
          .then(r=>r.json())
          .then(d => {
            const sl = d.addresses?.[0]?.address?.speedLimit;
            if(sl) {
              const lm = parseInt(sl.replace(/\\D/g,''));
              if(lm>0) {
                currLimit = lm;
                document.getElementById('speedLimitVal').textContent = lm;
                document.getElementById('speedLimitSign').classList.remove('hidden');
                return;
              }
            }
            currLimit = 0;
            document.getElementById('speedLimitSign').classList.add('hidden');
          }).catch(e=>{});
      }
    });
  }

  // Music poll stub (simplified for HUD)
  async function pollMusic(){
    try{
      if(!window.Capacitor||!Capacitor.Plugins.MediaControlPlugin) return;
      const info=await Capacitor.Plugins.MediaControlPlugin.getPlayingInfo();
      if(info.title){
        document.getElementById('musicFab').classList.remove('hidden');
      }else{
        document.getElementById('musicFab').classList.add('hidden');
      }
    }catch(e){}
  }
  setInterval(pollMusic,2000);pollMusic();

</script>
</body>
