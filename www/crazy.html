<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Telemetry Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00e5ff;
    --red: #ff003c;
    --amber: #ffb703;
    --green: #00ff66;
    --bg-dark: #0a0b10;
    --bg-panel: rgba(20, 22, 28, 0.85);
    --dim: rgba(255,255,255,0.45);
    --hud-border: 1px solid rgba(255, 255, 255, 0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; 
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg-dark); color: #fff; font-family: 'Share Tech Mono', monospace;
    overflow: hidden; touch-action: none; width: 100vw; height: 100vh;
  }
  
  #app {
    position: relative; width: 100%; height: 100%; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 10px) env(safe-area-inset-right, 15px) env(safe-area-inset-bottom, 10px) env(safe-area-inset-left, 15px);
  }

  /* Radial Glows */
  .bg-glow {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
    background: radial-gradient(circle at 35% 50%, rgba(0,229,255,0.15) 0%, transparent 50%),
                radial-gradient(circle at 65% 50%, rgba(255,0,60,0.15) 0%, transparent 50%);
  }

  /* TOP BAR */
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 20px; z-index: 10; height: 30px; margin-bottom: 5px;
  }
  .tb-title {
    font-size: 14px; font-weight: bold; letter-spacing: 2px; color: #fff; font-family: 'Orbitron', sans-serif;
  }
  .tb-center {
    display: flex; gap: 20px; align-items: center; font-size: 11px; color: var(--dim);
  }
  .tb-redline { color: var(--red); font-family: 'Orbitron', sans-serif; }
  
  /* MAIN CONTENT AREA */
  .main-content {
    flex: 1; display: flex; position: relative; z-index: 10;
  }
  
  /* PANELS */
  .side-panel {
    width: 250px; display: flex; flex-direction: column; gap: 10px;
    z-index: 5; justify-content: space-between;
  }
  .panel-box {
    background: var(--bg-panel); border: var(--hud-border); border-radius: 8px;
    padding: 12px; position: relative; display: flex; flex-direction: column;
  }
  /* Chamfered corners style */
  .panel-box.left { clip-path: polygon(0 0, 100% 0, 100% 100%, 15px 100%, 0 calc(100% - 15px)); }
  .panel-box.right { clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%); }
  
  .panel-title { font-size: 10px; color: var(--dim); letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase; }
  
  /* LEFT PANEL - ECT */
  .ect-layout { display: flex; align-items: flex-start; justify-content: space-between; }
  .ect-val-box { display: flex; flex-direction: column; }
  .ect-val { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 700; color: #fff; display: flex; align-items: baseline; gap: 2px; }
  .ect-unit { font-size: 12px; }
  
  /* Segmented Bar Chart - ECT */
  .ect-bars { display: flex; flex-direction: column-reverse; gap: 2px; height: 60px; }
  .ect-segment { width: 12px; height: 4px; background: rgba(255,255,255,0.1); }
  .ect-segment.active { background: var(--cyan); box-shadow: 0 0 5px var(--cyan); }
  
  /* LEFT PANEL - TPS */
  .tps-layout { display: flex; flex-direction: column; gap: 8px; }
  .tps-val-box { display: flex; align-items: baseline; gap: 6px; }
  .tps-val { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 700; color: #fff; }
  
  /* Stepped Bar Chart - TPS */
  .tps-bars { display: flex; align-items: flex-end; gap: 2px; height: 35px; }
  .tps-segment { width: 8px; background: rgba(255,255,255,0.1); }
  .tps-segment.active { background: var(--cyan); box-shadow: 0 0 5px var(--cyan); }
  
  /* LEFT PANEL - TRIP */
  .trip-list { display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
  .trip-item { display: flex; justify-content: space-between; }
  .trip-lbl { color: var(--dim); }
  .trip-v { font-family: 'Orbitron', sans-serif; font-weight: 500; }

  /* RIGHT PANEL - BATT */
  .batt-layout { display: flex; flex-direction: column; gap: 8px; }
  .batt-val-box { display: flex; align-items: baseline; justify-content: flex-end; gap: 6px; }
  .batt-val { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 700; color: #fff; }
  .batt-status-txt { font-size: 12px; color: var(--green); }
  
  /* Segmented Bar Chart - BATT */
  .batt-bars { display: flex; align-items: flex-end; justify-content: space-between; height: 40px; }
  .batt-segment { width: 6px; background: rgba(255,255,255,0.1); }
  .batt-segment.active { background: var(--cyan); box-shadow: 0 0 5px var(--cyan); }
  
  /* RIGHT PANEL - DIAGNOSTICS */
  .diag-list { display: flex; flex-direction: column; gap: 6px; }
  .diag-item { display: flex; justify-content: space-between; font-size: 11px; align-items: center; }
  .diag-icon { font-size: 14px; width: 20px; text-align: center; }
  .diag-ok { color: var(--green); }
  .diag-fault { color: var(--red); animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  
  /* RIGHT PANEL - TIME */
  .time-layout { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .time-date { font-size: 10px; color: var(--dim); text-transform: uppercase; }
  .time-clock { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 700; color: #fff; }

  /* CENTER GAUGE */
  .center-gauge-container {
    flex: 1; display: flex; justify-content: center; align-items: center; position: relative; z-index: 10;
  }
  .gauge-svg { width: min(100%, 90vh); height: auto; overflow: visible; filter: drop-shadow(0 0 10px rgba(0,229,255,0.2)); }
  .gauge-segment { stroke-linecap: butt; stroke-width: 6; transition: stroke 0.05s, filter 0.05s; }
  .gauge-text { fill: rgba(255,255,255,0.8); font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 700; text-anchor: middle; }
  .gauge-text.red { fill: var(--red); }
  
  .speed-display {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 200px; height: 200px;
  }
  
  .speed-lbl { font-size: 14px; color: var(--dim); letter-spacing: 2px; margin-bottom: -10px; text-transform: uppercase; }
  .speed-val { font-family: 'Orbitron', sans-serif; font-style: italic; font-size: 110px; font-weight: 900; line-height: 1; letter-spacing: -4px; color: var(--cyan); text-shadow: 0 0 25px rgba(0,229,255,0.6); }
  .speed-unit { font-size: 16px; color: var(--dim); letter-spacing: 2px; margin-top: -5px; }

  /* Warning Icons */
  .warning-icons { display: flex; justify-content: space-around; align-items: center; margin-top: 15px; }
  .w-icon { width: 36px; height: 36px; color: rgba(255,255,255,0.05); transition: color 0.3s, filter 0.3s; }
  .w-icon.alert-red { color: var(--red); filter: drop-shadow(0 0 10px var(--red)); animation: blink 1s infinite; }
  .w-icon.alert-amber { color: var(--amber); filter: drop-shadow(0 0 10px var(--amber)); }
  
  .center-bottom-info {
    position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%);
    display: flex; gap: 30px; font-size: 12px; color: var(--dim); align-items: baseline;
  }
  .cbi-val { font-family: 'Orbitron', sans-serif; font-size: 16px; color: #fff; font-weight: 500; margin-left: 6px; }

  /* SPEED LIMIT SIGN */
  .speed-limit-sign {
    position: absolute; top: 15%; right: 15%;
    width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid var(--red); background: rgba(255,255,255,0.95);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 15px rgba(255,0,60,0.5); z-index: 20;
  }
  .speed-limit-val { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900; color: #111; }

  /* BOTTOM BAR */
  .bottom-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 20px; z-index: 10; height: 30px; margin-top: 5px; font-size: 11px;
  }
  .bb-connection { color: var(--green); display: flex; align-items: center; gap: 8px; }
  .bb-settings { color: var(--dim); cursor: pointer; display: flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 4px;}
  
  /* RESPONSIVE SCALING */
  @media (max-width: 700px) {
    .side-panel { width: 180px; }
    .speed-val { font-size: 80px; }
    .panel-box { padding: 8px; }
  }

</style>
</head>
<body>

<div id="app">
  <div class="bg-glow"></div>
  
  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="tb-title">STATUS</div>
    <div class="tb-center">
      <span>LEAN ANGLE: <span style="color:#fff">0°</span></span>
      <span>REDLINE: <span class="tb-redline">11,500</span></span>
    </div>
    <div class="tb-title">TELEMETRY</div>
  </div>
  
  <div class="main-content">
    
    <!-- LEFT PANEL -->
    <div class="side-panel">
      <!-- ECT -->
      <div class="panel-box left" style="flex: 1.2;">
        <div class="panel-title">ENGINE COOLANT TEMP</div>
        <div class="ect-layout">
          <div class="ect-bars" id="ectBars">
            <!-- segments -->
          </div>
          <div class="ect-val-box">
            <span class="ect-val"><span id="ectVal">--</span><span class="ect-unit">°C</span></span>
          </div>
        </div>
      </div>
      
      <!-- TPS -->
      <div class="panel-box left" style="flex: 1;">
        <div class="panel-title">THROTTLE POSITION</div>
        <div class="tps-layout">
          <div class="tps-val-box">
            <span class="tps-val">TPS: <span id="tpsVal">--</span>%</span>
          </div>
          <div class="tps-bars" id="tpsBars">
            <!-- segments -->
          </div>
        </div>
      </div>
      
      <!-- TRIP -->
      <div class="panel-box left" style="flex: 1;">
        <div class="trip-list">
          <div class="trip-item"><span class="trip-lbl">Trip A:</span><span class="trip-v"><span id="tripVal">0.0</span> km</span></div>
          <div class="trip-item"><span class="trip-lbl">Avg Fuel:</span><span class="trip-v"><span id="fuelVal">0.0</span> L/100</span></div>
          <div class="trip-item"><span class="trip-lbl">Fuel:</span><span class="trip-v">100%</span></div>
        </div>
      </div>
    </div>
    
    <!-- CENTER GAUGE -->
    <div class="center-gauge-container">
      <svg class="gauge-svg" viewBox="-130 -130 260 260" id="gaugeSvg">
        <!-- Ticks generated by JS -->
        <g id="gaugeTicks"></g>
        <g id="gaugeLabels"></g>
      </svg>
      
      <div class="speed-display">
        <div class="speed-lbl">SPEED</div>
        <div class="speed-val" id="speedVal">0</div>
        <div class="speed-unit">km/h</div>
      </div>
      
      <div class="center-bottom-info">
        <span>RPM <span class="cbi-val" id="rpmBotVal">0</span></span>
        <span>ODO <span class="cbi-val">12,450 km</span></span>
      </div>
      
      <div class="speed-limit-sign" id="speedLimitSign">
        <span class="speed-limit-val" id="speedLimitVal">--</span>
      </div>
    </div>
    
    <!-- RIGHT PANEL -->
    <div class="side-panel">
      <!-- BATT -->
      <div class="panel-box right" style="flex: 1.2;">
        <div class="panel-title" style="text-align: right;">BATTERY VOLTAGE</div>
        <div class="batt-layout">
          <div class="batt-val-box">
            <span class="batt-val"><span id="battVal">--</span>V</span>
            <span class="batt-status-txt" id="battStatus">GOOD</span>
          </div>
          <div class="batt-bars" id="battBars">
            <!-- segments -->
          </div>
        </div>
      </div>
      
      <!-- DIAGNOSTICS -->
      <div class="panel-box right" style="flex: 1.2;">
        <div class="panel-title" style="text-align: right;">SYSTEM ALERTS</div>
        <div class="warning-icons" id="warningIcons">
          <!-- Engine -->
          <svg viewBox="0 0 24 24" class="w-icon" id="icon-engine"><path fill="currentColor" d="M19,9V7H17V6.5A1.5,1.5 0 0,0 15.5,5H13V3H11V5H8.5A1.5,1.5 0 0,0 7,6.5V7H5V9H7V10H5V12H7V13H5V15H7V17.5A1.5,1.5 0 0,0 8.5,19H15.5A1.5,1.5 0 0,0 17,17.5V17H19V15H17V14H19V12H17V11H19V9M10,15H8V13H10V15M10,11H8V9H10V11M16,15H14V13H16V15M16,11H14V9H16V11Z"/></svg>
          <!-- Temp -->
          <svg viewBox="0 0 24 24" class="w-icon" id="icon-temp"><path fill="currentColor" d="M15,13V5A3,3 0 0,0 9,5V13A5,5 0 1,0 15,13M12,4A1,1 0 0,1 13,5V8H11V5A1,1 0 0,1 12,4Z"/></svg>
          <!-- Battery -->
          <svg viewBox="0 0 24 24" class="w-icon" id="icon-batt"><path fill="currentColor" d="M16.67,4H15V2H9V4H7.33C6.6,4 6,4.6 6,5.33V20.67C6,21.4 6.6,22 7.33,22H16.67C17.4,22 18,21.4 18,20.67V5.33C18,4.6 17.4,4 16.67,4M11,16H9V14H11V16M15,16H13V14H15V16M11,12H9V10H11V12M15,12H13V10H15V12M15,8H9V6H15V8Z"/></svg>
          <!-- ABS -->
          <svg viewBox="0 0 24 24" class="w-icon" id="icon-abs"><path fill="currentColor" d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4M8,7.5H10.5C11.3,7.5 12,8.2 12,9V11.5C12,12.3 11.3,13 10.5,13H8V7.5M9.5,9V11.5H10.5V9H9.5M13.5,7.5H16C16.8,7.5 17.5,8.2 17.5,9V10.5C17.5,11.3 16.8,12 16,12V14.5C16,15.3 15.3,16 14.5,16H12V7.5H13.5M13.5,9V11.5H14.5V9H13.5M13.5,13V14.5H14.5V13H13.5Z"/></svg>
        </div>
      </div>
      
      <!-- TIME -->
      <div class="panel-box right" style="flex: 0.8; justify-content: center;">
        <div class="time-layout">
          <span class="time-date" id="dateStr">SAT, 26 OCT</span>
          <span class="time-clock" id="clock">00:00:00</span>
        </div>
      </div>
    </div>
    
  </div>
  
  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <div class="bb-connection">
      <span style="font-size: 14px;">🔌</span> DIAGNOSTIC CONNECTION: <span style="font-weight:bold;">CONNECTED</span>
    </div>
    <div class="bb-settings" id="btnGear">
      PROFILE SETTINGS ⚙
    </div>
  </div>
  
</div>

<script src="js/data_engine.js"></script>
<script src="js/trip_tracker.js"></script>
<script>
  // --- CLOCK ---
  function updateClock() {
    const n = new Date();
    document.getElementById('clock').textContent = 
      String(n.getHours()).padStart(2,'0') + ':' + 
      String(n.getMinutes()).padStart(2,'0') + ':' + 
      String(n.getSeconds()).padStart(2,'0');
    
    const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    document.getElementById('dateStr').textContent = days[n.getDay()] + ', ' + n.getDate() + ' ' + months[n.getMonth()];
  }
  setInterval(updateClock, 1000); updateClock();

  // --- SETTINGS ---
  document.getElementById('btnGear').addEventListener('click', () => {
    window.location.href = 'settings.html';
  });

  // --- BUILD CHARTS ---
  const ectBars = document.getElementById('ectBars');
  const numEct = 10;
  for(let i=0; i<numEct; i++) {
    const seg = document.createElement('div');
    seg.className = 'ect-segment';
    ectBars.appendChild(seg);
  }
  function updateEctChart(temp) {
    const ratio = Math.min(Math.max((temp - 40) / 80, 0), 1);
    const active = Math.round(ratio * numEct);
    const segs = ectBars.children;
    for(let i=0; i<numEct; i++) {
      if(i < active) {
        segs[numEct - 1 - i].classList.add('active');
        if(temp >= 110) { segs[numEct - 1 - i].style.background = 'var(--red)'; segs[numEct - 1 - i].style.boxShadow = '0 0 5px var(--red)'; }
        else if (temp > 100) { segs[numEct - 1 - i].style.background = 'var(--amber)'; segs[numEct - 1 - i].style.boxShadow = '0 0 5px var(--amber)'; }
        else { segs[numEct - 1 - i].style.background = ''; segs[numEct - 1 - i].style.boxShadow = ''; }
      } else {
        segs[numEct - 1 - i].classList.remove('active');
      }
    }
  }

  const tpsBars = document.getElementById('tpsBars');
  const numTps = 15;
  for(let i=0; i<numTps; i++) {
    const seg = document.createElement('div');
    seg.className = 'tps-segment';
    seg.style.height = (10 + (i * 1.5)) + 'px';
    tpsBars.appendChild(seg);
  }
  function updateTpsChart(tps) {
    const active = Math.round((tps / 100) * numTps);
    const segs = tpsBars.children;
    for(let i=0; i<numTps; i++) {
      if(i < active) segs[i].classList.add('active');
      else segs[i].classList.remove('active');
    }
  }

  const battBars = document.getElementById('battBars');
  const numBatt = 20;
  const battHeights = [15,25,35,20,30,40,25,15,35,25,40,20,30,25,15,35,20,30,25,40];
  for(let i=0; i<numBatt; i++) {
    const seg = document.createElement('div');
    seg.className = 'batt-segment';
    seg.style.height = battHeights[i] + 'px';
    battBars.appendChild(seg);
  }
  function updateBattChart(volt) {
    const ratio = Math.min(Math.max((volt - 10) / 5, 0), 1);
    const active = Math.round(ratio * numBatt);
    const segs = battBars.children;
    for(let i=0; i<numBatt; i++) {
      if(i < active) {
        segs[i].classList.add('active');
        if(volt > 14.8 || volt < 11.5) { segs[i].style.background = 'var(--red)'; segs[i].style.boxShadow = '0 0 5px var(--red)'; }
        else if (volt <= 12.0) { segs[i].style.background = 'var(--amber)'; segs[i].style.boxShadow = '0 0 5px var(--amber)'; }
        else { segs[i].style.background = ''; segs[i].style.boxShadow = ''; }
      }
      else segs[i].classList.remove('active');
    }
  }

  // --- SVG GAUGE ---
  const MAX_RPM = 14000;
  const START_ANGLE = -135;
  const END_ANGLE = 135;
  const RADIUS = 95;
  
  const gTicks = document.getElementById('gaugeTicks');
  const gLabels = document.getElementById('gaugeLabels');
  const numGaugeTicks = 60;
  const segments = [];
  
  for(let i=0; i<numGaugeTicks; i++) {
    const ratio = i / (numGaugeTicks - 1);
    const angleDeg = START_ANGLE + (END_ANGLE - START_ANGLE) * ratio;
    const angleRad = angleDeg * Math.PI / 180;
    
    // Determine color
    let color = [0, 229, 255]; // Cyan
    if (ratio > 0.6 && ratio <= 0.8) {
      color = [255, 183, 3]; // Amber
    } else if (ratio > 0.8) {
      color = [255, 0, 60]; // Red
    }
    
    const r1 = RADIUS;
    const r2 = RADIUS + 25; // 25px thick outward
    
    const x1 = Math.sin(angleRad) * r1;
    const y1 = -Math.cos(angleRad) * r1;
    const x2 = Math.sin(angleRad) * r2;
    const y2 = -Math.cos(angleRad) * r2;
    
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('class', 'gauge-segment');
    
    const rgbStr = `rgb(${color[0]},${color[1]},${color[2]})`;
    line.setAttribute('data-color', rgbStr);
    line.style.stroke = 'rgba(255,255,255,0.05)';
    
    gTicks.appendChild(line);
    segments.push(line);

    if (i % 6 === 0 || i === numGaugeTicks - 1) {
      const num = i / (numGaugeTicks - 1) * 14;
      const lr = RADIUS - 20;
      const lx = Math.sin(angleRad) * lr;
      const ly = -Math.cos(angleRad) * lr;
      const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', lx);
      txt.setAttribute('y', ly + 6);
      txt.setAttribute('class', num >= 11.5 ? 'gauge-text red' : 'gauge-text');
      txt.textContent = Math.round(num);
      gLabels.appendChild(txt);
    }
  }

  function updateGauge(rpm) {
    if(rpm > MAX_RPM) rpm = MAX_RPM;
    const ratio = rpm / MAX_RPM;
    
    const activeTicks = Math.round(ratio * numGaugeTicks);
    for(let i=0; i<numGaugeTicks; i++) {
      if(i < activeTicks) {
        segments[i].style.stroke = segments[i].getAttribute('data-color');
        segments[i].style.filter = `drop-shadow(0 0 6px ${segments[i].getAttribute('data-color')})`;
      } else {
        segments[i].style.stroke = 'rgba(255,255,255,0.05)';
        segments[i].style.filter = 'none';
      }
    }
  }

  // --- ECU EVENT ---
  let lastECUSpeed = 0;
  window.addEventListener('ecu_data', (e) => {
    const data = e.detail;
    lastECUSpeed = data.speed;
    
    document.getElementById('speedVal').textContent = Math.round(data.speed);
    document.getElementById('rpmBotVal').textContent = Math.round(data.rpm);
    
    updateGauge(data.rpm);
    
    const ectEl = document.getElementById('ectVal');
    ectEl.textContent = Math.round(data.ect);
    if (data.ect >= 110) ectEl.style.color = 'var(--red)';
    else if (data.ect > 100) ectEl.style.color = 'var(--amber)';
    else ectEl.style.color = '';
    updateEctChart(data.ect);
    
    document.getElementById('tpsVal').textContent = Math.round(data.tps);
    updateTpsChart(data.tps);
    
    const battEl = document.getElementById('battVal');
    battEl.textContent = data.battery.toFixed(1);
    if (data.battery > 14.8 || data.battery < 11.5) battEl.style.color = 'var(--red)';
    else if (data.battery <= 12.0) battEl.style.color = 'var(--amber)';
    else battEl.style.color = '';
    
    const battStatus = document.getElementById('battStatus');
    if (data.battery > 14.8) {
      battStatus.textContent = 'HIGH';
      battStatus.style.color = 'var(--red)';
    } else if (data.battery < 11.5) {
      battStatus.textContent = 'LOW';
      battStatus.style.color = 'var(--red)';
    } else if (data.battery <= 12.0) {
      battStatus.textContent = 'WARN';
      battStatus.style.color = 'var(--amber)';
    } else {
      battStatus.textContent = 'GOOD';
      battStatus.style.color = 'var(--green)';
    }
    updateBattChart(data.battery);
    
    document.getElementById('tripVal').textContent = data.tripA.toFixed(1);
    if(document.getElementById('fuelVal')) document.getElementById('fuelVal').textContent = data.instantL100km.toFixed(1);
    
    if (window.TripTracker && TripTracker.isRecording()) {
      TripTracker.addECUData(Math.round(data.speed), data.rpm, data.ect, data.tps, data.battery);
    }
    
    // --- WARNING ICONS LOGIC ---
    const iconEngine = document.getElementById('icon-engine');
    if (data.rpm > 12000) { iconEngine.classList.add('alert-red'); }
    else { iconEngine.classList.remove('alert-red'); }
    
    const iconTemp = document.getElementById('icon-temp');
    if (data.ect >= 110) { iconTemp.classList.add('alert-red'); iconTemp.classList.remove('alert-amber'); }
    else if (data.ect > 100) { iconTemp.classList.add('alert-amber'); iconTemp.classList.remove('alert-red'); }
    else { iconTemp.classList.remove('alert-red', 'alert-amber'); }
    
    const iconBatt = document.getElementById('icon-batt');
    if (data.battery < 11.5 || data.battery > 14.8) { iconBatt.classList.add('alert-red'); iconBatt.classList.remove('alert-amber'); }
    else if (data.battery <= 12.0) { iconBatt.classList.add('alert-amber'); iconBatt.classList.remove('alert-red'); }
    else { iconBatt.classList.remove('alert-red', 'alert-amber'); }
  });

  // --- SPEED LIMIT EVENT ---
  let currentSpeedLimit = 0;
  window.addEventListener('speed_limit_data', (e) => {
    currentSpeedLimit = e.detail.limit;
    const valEl = document.getElementById('speedLimitVal');
    if (valEl) {
      valEl.textContent = currentSpeedLimit > 0 ? currentSpeedLimit : '--';
    }
  });
</script>
</body>
</html>
